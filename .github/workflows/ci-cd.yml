name: HomeLink CI/CD Pipeline

# Trigger workflow on push to develop branch or manually
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-backend:
    name: Build Backend (Spring Boot)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
        
    - name: Make Maven wrapper executable
      working-directory: ./backend
      run: chmod +x mvnw
        
    - name: Build backend with Maven
      working-directory: ./backend
      run: ./mvnw clean package -DskipTests
      
    - name: Run backend tests
      working-directory: ./backend
      run: ./mvnw test
      continue-on-error: true  # Don't fail workflow if no tests exist
      
    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: backend/target/*.jar
        retention-days: 30

  build-frontend:
    name: Build Frontend (Angular)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build frontend
      working-directory: ./frontend
      run: npm run build --if-present
      
    - name: Run frontend tests
      working-directory: ./frontend
      run: npm test --if-present -- --watch=false --browsers=ChromeHeadless
      continue-on-error: true  # Don't fail if no tests configured
      
    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: frontend/dist/
        retention-days: 30

  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        echo "=========================================="
        echo "HomeLink CI/CD Pipeline Summary"
        echo "=========================================="
        echo "Backend Build: ${{ needs.build-backend.result }}"
        echo "Frontend Build: ${{ needs.build-frontend.result }}"
        echo "=========================================="
        
        if [[ "${{ needs.build-backend.result }}" == "success" && "${{ needs.build-frontend.result }}" == "success" ]]; then
          echo "✅ All builds succeeded!"
          exit 0
        else
          echo "❌ One or more builds failed"
          exit 1
        fi