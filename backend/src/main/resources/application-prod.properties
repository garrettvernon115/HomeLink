spring.jpa.show-sql=false
# 'update' matches the schema management the app ran under on AWS RDS. The data
# restored from the RDS dump has legacy column types (e.g. int PKs) that predate
# the current entity model, so strict 'validate' fails on boot. Long-term fix:
# introduce Flyway migrations and switch this back to 'validate'.
spring.jpa.hibernate.ddl-auto=update
logging.level.com.homelink=INFO
logging.level.org.springframework.security=WARN
server.error.include-message=never
server.error.include-detail=never
