spring.application.name=HomeLink
# Honors the PORT injected by hosts like Render; falls back to 8080 locally.
server.port=${PORT:8080}

# Loads credentials from application-secrets.properties (gitignored, never committed)
spring.config.import=optional:classpath:application-secrets.properties

# Database - connection details supplied via environment variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection pool resilience.
# Fail fast instead of hanging when the database is briefly unreachable (for
# example a managed DB that powers off when idle). Requests then return a
# prompt error rather than blocking for ~90s, and the app recovers on its own
# once the database is back instead of needing a manual restart.
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=5
# JDBC-level TCP connect and socket-read timeouts, set here so they apply
# regardless of the DB_URL provided via the environment.
spring.datasource.hikari.data-source-properties.connectTimeout=10000
spring.datasource.hikari.data-source-properties.socketTimeout=30000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.homelink=DEBUG
logging.level.org.springframework.security=DEBUG

# Include error details in API responses
server.error.include-message=always
server.error.include-detail=always

# JWT Configuration
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevPurposesOnlyDoNotUseInProduction}
jwt.expiration=86400000
