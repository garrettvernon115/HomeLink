spring.application.name=HomeLink
# Honors the PORT injected by hosts like Render; falls back to 8080 locally.
server.port=${PORT:8080}

# Loads credentials from application-secrets.properties (gitignored, never committed)
spring.config.import=optional:classpath:application-secrets.properties

# Database - AWS RDS (Shared Team Database)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.com.homelink=DEBUG
logging.level.org.springframework.security=DEBUG

# Include error details in API responses
server.error.include-message=always
server.error.include-detail=always

# JWT Configuration
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevPurposesOnlyDoNotUseInProduction}
jwt.expiration=86400000
