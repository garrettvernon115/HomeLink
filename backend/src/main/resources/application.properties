spring.application.name=HomeLink
server.port=8080

# Database - AWS RDS (Shared Team Database)
spring.datasource.url=jdbc:mysql://homelink-dev-db.c1m46usu2fzm.us-east-2.rds.amazonaws.com:3306/homelink_db?useSSL=true&requireSSL=true
