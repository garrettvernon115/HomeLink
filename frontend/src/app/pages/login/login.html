<!--

Login Page Component HTML template
@author: [Derek Olive]
Version: 1.1 (Updated to use reactive forms and AuthService)

-->

<!-- Login page container -->
<section class="login-container">

  <div class="login-card">

    <h2>Welcome Back</h2>
    <p class="login-subtitle">
      Login to HomeLink to connect with trusted home service professionals.
    </p>

    <!-- Success Message -->
    <div *ngIf="successMessage" class="alert alert-success">
      {{ successMessage }}
    </div>

    <!-- Error Message -->
    <p class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

      <!-- EMAIL -->
      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          [class.error]="hasError('email')"
          placeholder="Enter your email"
        />

        <small *ngIf="hasError('email')" class="validation">
          {{ getErrorMessage('email') }}
        </small>
      </div>


      <!-- PASSWORD -->
      <div class="form-group password-group">

        <label for="password">Password</label>

        <div class="password-wrapper">

          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            formControlName="password"
            class="form-control"
            [class.error]="hasError('password')"
            placeholder="Enter your password"
          />
          
          <!-- Show/hide password button -->
          <button
            type="button"
            class="show-password"
            (click)="showPassword = !showPassword"
          >
            {{ showPassword ? 'Hide' : 'Show' }}
          </button>

        </div>

        <small *ngIf="hasError('password')" class="validation">
          {{ getErrorMessage('password') }}
        </small>

      </div>


      <!-- LOGIN BUTTON -->
      <button
        type="submit"
        class="login-button"
        [disabled]="isLoading"
      >

        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading">Logging in...</span>

      </button>

    </form>


    <!-- EXTRA LINKS -->
    <div class="login-links">

      <a routerLink="/forgot-password">
        Forgot password?
      </a>

      <p>
        New user?
        <a routerLink="/signup">Sign Up</a>
      </p>

    </div>

  </div>

</section>
